[server]
host = "0.0.0.0"
port = 8080

[backend]
url = "https://dummyjson.com"
timeout_seconds = 10

[cache]
enabled = true
default_ttl_seconds = 60
max_memory_mb = 1024
shards = 16
eviction_policy = "lru"
negative_ttl_seconds = 10

[[cache.rules]]
pattern = "/api/products/*"
ttl_seconds = 300

[[cache.rules]]
pattern = "/api/users/*"
ttl_seconds = 60

[[cache.rules]]
pattern = "/api/config/*"
ttl_seconds = 3600
