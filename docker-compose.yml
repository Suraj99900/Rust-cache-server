version: "3.8"

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rust-cache-gateway
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
    volumes:
      - ./config:/app/config:ro
    depends_on:
      - backend

  backend:
    image: python:3.11-alpine
    container_name: demo-backend-api
    command: >
      sh -c "python3 -c '
      import http.server, socketserver, json, time
      class Handler(http.server.SimpleHTTPRequestHandler):
          def do_GET(self):
              time.sleep(0.05) # Simulate database latency
              self.send_response(200)
              self.send_header(\"Content-Type\", \"application/json\")
              self.end_headers()
              self.wfile.write(json.dumps({\"message\": \"Hello from real backend!\", \"path\": self.path, \"timestamp\": time.time()}).encode())
          def do_PUT(self):
              self.send_response(200)
              self.send_header(\"Content-Type\", \"application/json\")
              self.end_headers()
              self.wfile.write(json.dumps({\"status\": \"updated\"}).encode())
      with socketserver.TCPServer((\"\", 5000), Handler) as httpd:
          print(\"Demo backend running on port 5000\")
          httpd.serve_forever()
      '"
    ports:
      - "5000:5000"
